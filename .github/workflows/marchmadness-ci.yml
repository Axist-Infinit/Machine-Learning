name: MarchMadness-AI CI

on:
  push:
    branches: [master, mmai-2027]
    paths:
      - 'MarchMadness-AI/**'
      - '.github/workflows/marchmadness-ci.yml'
  pull_request:
    paths:
      - 'MarchMadness-AI/**'
      - '.github/workflows/marchmadness-ci.yml'

defaults:
  run:
    working-directory: MarchMadness-AI

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'MarchMadness-AI/requirements.lock'
      - name: Install pinned deps + package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e ".[dev]"
      # Tests use synthetic fixtures only: Kaggle data and API keys never reach CI.
      # legacy/ is frozen and excluded (testpaths = tests).
      - name: Run tests
        run: pytest

  lint:
    name: lint (ruff, src + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src tests
