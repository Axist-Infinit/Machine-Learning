[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mmai"
version = "0.1.0"
description = "MarchMadness-AI: as-of NCAA basketball ratings, score distributions, brackets, Kaggle and betting tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyarrow>=14",
    "requests>=2.31",
    "pyyaml>=6",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]
ml = ["scikit-learn>=1.3", "xgboost>=2.0"]

[project.scripts]
mmai = "mmai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mmai = ["eval/prereg.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy"]
